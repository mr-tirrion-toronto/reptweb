name: Notify IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages to publish the verification key
        shell: bash
        run: |
          KEY_URL="https://tirrion.pages.dev/tirrion-seo-key-6d2f9a4c8b1e7f305a6d9c2e4b8f1a73.txt"
          for attempt in $(seq 1 12); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "$KEY_URL" || true)
            if [ "$status" = "200" ]; then
              echo "IndexNow key is publicly available."
              exit 0
            fi
            echo "Waiting for deployment (HTTP $status), attempt $attempt/12..."
            sleep 15
          done
          echo "Cloudflare did not publish the IndexNow key in time."
          exit 1
      - name: Notify participating search engines
        env:
          INDEXNOW_KEY: "0025e8f4c3ed5ff55cc2549a9b90d2a3"
        shell: bash
        run: |
          curl -sS --fail-with-body -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "{\"host\":\"tirrion.pages.dev\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://tirrion.pages.dev/tirrion-seo-key-6d2f9a4c8b1e7f305a6d9c2e4b8f1a73.txt\",\"urlList\":[\"https://tirrion.pages.dev/\",\"https://tirrion.pages.dev/privacy.html\",\"https://tirrion.pages.dev/terms.html\"]}"
